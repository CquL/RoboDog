# 用途：容器内 H2 只读检查和零速度停止测试的默认安全配置。
# 输入：PC2 上用于连接 H2 SDK2 DDS 的网卡 eth0 与域 0。
# 输出：UnitreeH2 初始化、FSM getter 和显式 zero-stop 所需参数。
# 安全边界：禁止非零速度和状态切换；初始化只确认 FSM getter 可用。
# required_motion_fsm_id=601 供启用运动时及外层 06C/06D 门禁校验。

# 适配器选择与 SDK2 通信参数。
robot_model: "unitree_h2"
network_interface_card_name: "eth0"
dds_domain_id: 0
sdk_timeout_s: 10.0

# 权限门禁：只允许状态接收、只读 RPC 和零速度停止。
allow_motion_commands: false
allow_state_changing_actions: false
verify_fsm_on_init: true
required_motion_fsm_id: 601

# 即使 safe 配置禁止运动，仍保留速度/看门狗参数用于配置完整性校验；
# 这些数值不会绕过 allow_motion_commands=false。
max_vx: 0.20
max_vy: 0.10
max_omega: 0.30
velocity_command_duration_s: 0.30
velocity_watchdog_hz: 50
velocity_command_timeout_ms: 250
velocity_zero_hold_ms: 1000
