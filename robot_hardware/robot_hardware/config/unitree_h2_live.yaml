# H2 实机运动配置。只应在测试区域清空、保护措施就绪且第二操作员持有原厂
# 遥控停止路径时使用；加载本文件本身不会发送动作或速度。
robot_model: "unitree_h2"

# SDK2/CycloneDDS 通过 PC2 的 eth0、Domain 0 访问 H2 原厂运动服务。
network_interface_card_name: "eth0"
dds_domain_id: 0

# 单次 RPC 等待超时（秒），不控制测试程序的总运动时长。
sdk_timeout_s: 10.0

# 项目安全门禁，并非 Unitree SDK2 原生参数。当前配置显式允许非零速度和
# 状态动作，但每条非零速度仍必须通过 FSM=601 检查。
allow_motion_commands: true
allow_state_changing_actions: true
verify_fsm_on_init: true
required_motion_fsm_id: 601

# 项目选择的速度包络（m/s、m/s、rad/s）。公开资料未给出 H2 SetVelocity
# 数值范围；提高这些值只放宽软件限幅，不会自动命令机器人运动。
max_vx: 1.00
max_vy: 0.10
max_omega: 0.70

# 每条厂商速度 RPC 的有效时长（秒），必须长于本地刷新/看门狗时间关系。
velocity_command_duration_s: 0.30

# 50 Hz 看门狗在 200 ms 无新速度时开始重复 StopMove；在 500 ms 保持窗口
# 结束后，仍需一次成功的 StopMove 才解除 active 标志。
velocity_watchdog_hz: 50
velocity_command_timeout_ms: 200
velocity_zero_hold_ms: 500
