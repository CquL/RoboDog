# Explicit H2 live-motion profile for the delivered robot.
# Use only after the operating area and original remote stop path are ready.
robot_model: "unitree_h2"

network_interface_card_name: "eth0"
dds_domain_id: 0
sdk_timeout_s: 10.0

# Project safety interlocks. These are not Unitree SDK parameters.
allow_motion_commands: true
allow_state_changing_actions: true
verify_fsm_on_init: true
required_motion_fsm_id: 601

# Project-reviewed envelope. Unitree publishes no H2 SetVelocity numeric range.
# vx=0.50 m/s is the official example value and passed the delivered-H2 test.
max_vx: 0.50
max_vy: 0.10
max_omega: 0.30
velocity_command_duration_s: 0.30

velocity_watchdog_hz: 50
velocity_command_timeout_ms: 200
velocity_zero_hold_ms: 500
