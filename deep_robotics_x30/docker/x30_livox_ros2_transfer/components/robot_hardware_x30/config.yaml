robot_model: "deep_robotics_x30"

motion_ip: "192.168.1.103"
motion_port: 43893

# X30 app_port 命令端点，仅供可选的速度源配置使用。
perception_ip: "192.168.1.105"
perception_port: 43899

local_port: 0
heartbeat_hz: 10
motion_command_source: "navigation"

# udp_navigation：向 105:43897 发送等价于原厂 /cmd_vel 的 UDP，随后经过地形安全层。
# udp_physical：直接向 103:43893 发送等价于原厂 /cmd_vel_corrected 的 UDP。
# udp_axis：旧版手动模式测试使用的手柄轴 UDP。
velocity_backend: "udp_navigation"
navigation_velocity_ip: "192.168.1.105"
navigation_velocity_port: 43897

velocity_watchdog_hz: 50
velocity_command_timeout_ms: 250
velocity_zero_hold_ms: 3000

max_vx: 1.0
max_vy: 0.5
max_omega: 1.2

# 轴向符号配置仅在 velocity_backend 为 udp_axis 时生效。
invert_vy_axis: true
invert_omega_axis: true

configure_non_manual_mode: false
configure_navigation_velocity_source: false
